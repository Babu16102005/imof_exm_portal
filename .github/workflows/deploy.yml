# Deploy Vite React app (imof_exam_portal) to GitHub Pages
# Triggers on push to main. Uses --base flag so vite.config.js stays untouched.
# For a project site the base MUST be /<repo-name>/, otherwise assets 404 (blank page).
# If this repo is renamed, update BASE_PATH below to match.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # CHANGE THIS if repo name changes. Must match GitHub repo name exactly.
  BASE_PATH: /imof_exm_portal/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build (GitHub Pages base path)
        # --base overrides vite config without editing the file.
        # Secrets are injected as env so VITE_* vars are baked at build time.
        run: npm run build -- --base=$BASE_PATH
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_MOCK_MODE: ${{ secrets.VITE_MOCK_MODE }}
          VITE_ADMIN_ID: ${{ secrets.VITE_ADMIN_ID }}
          VITE_ADMIN_PASSWORD: ${{ secrets.VITE_ADMIN_PASSWORD }}

      - name: SPA fallback for GitHub Pages
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
